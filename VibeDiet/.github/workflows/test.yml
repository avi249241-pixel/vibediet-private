name: VibeDiet 5-Gate CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 - TypeScript Type Safety Check
        run: npx tsc --noEmit

      - name: Gate 2 - Vitest Unit & Integration Suites
        run: npm test

      - name: Gate 3 & 5 - Production Build, Single-File Bundle & Secret Scan
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Gate 4 - Playwright End-to-End Browser Verification
        run: npx playwright test
