name: VibeDiet 5-Gate Production Quality & Security CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: VibeDiet

jobs:
  quality-and-security-gates:
    name: 5-Gate CI Quality & Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NODE_ENV: "test"
      PORT: "3000"
      PLAYWRIGHT: "1"
      # Dummy safe environment variables to satisfy schema validation and backend guards
      GEMINI_API_KEY: "dummy-safe-gemini-key-for-ci-testing-a1b2c3d4e5f6"
      GEMINI_API_KEYS: "dummy-safe-gemini-key-for-ci-testing-a1b2c3d4e5f6"
      FIREBASE_PROJECT_ID: "vibediet-ci-mock-project"
      USDA_FDC_API_KEY: "DEMO_KEY"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/vibediet_ci_dummy"
      SUPABASE_URL: "https://vibediet-ci-dummy.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key_for_ci_gate"
      SUPABASE_JWT_SECRET: "dummy_jwt_secret_minimum_32_characters_for_ci_gate"
      # Vite public env vars (must be prefixed VITE_ for frontend build)
      VITE_SUPABASE_URL: "https://vibediet-ci-dummy.supabase.co"
      VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key_for_ci_gate"
      ADMIN_SECRET: "dummy_admin_secret_token_gate_pass_ci"
      ADMIN_ACCESS_TOKEN: "dummy_admin_secret_token_gate_pass_ci"
      ADMIN_UIDS: "admin-ci-uid,demo-user-uid"
      ALLOWED_ORIGINS: "http://127.0.0.1:3000,http://localhost:3000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: VibeDiet/package-lock.json

      - name: "Gate 1: Dependency Integrity & Clean Install (npm ci)"
        run: npm ci

      - name: "Gate 2: Strict TypeScript Static Typecheck (npm run typecheck)"
        run: npm run typecheck

      - name: "Gate 3: Vitest Nutrition, Swarm & Persistence Tests (npm test)"
        run: npm test

      - name: "Gate 4: Production Multi-File & Single-File Bundles (npm run build)"
        run: npm run build

      - name: "Gate 5: Automated Bundle Secret Scanner (npm run scan)"
        run: npm run scan

      - name: Install Playwright Browsers and OS Dependencies
        run: npx playwright install --with-deps chrome chromium

      - name: "Gate 6: Headless Playwright End-to-End User Journeys (npx playwright test)"
        run: npx playwright test

      - name: Upload Playwright Test Results & Traces on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            VibeDiet/test-results/
            VibeDiet/playwright-report/
          retention-days: 7
