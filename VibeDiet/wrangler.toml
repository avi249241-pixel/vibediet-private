name = "vibediet-app"
main = "./src/worker/index.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

[triggers]
crons = ["0 3 */3 * *"]
