services:
  - type: web
    name: vibediet-commercial-saas
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: USDA_FDC_API_KEY
        value: DEMO_KEY

